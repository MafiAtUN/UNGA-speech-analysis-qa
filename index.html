<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNGA Speech Analysis - Q&A Session</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>UNGA Speech Analysis</h1>
            <p class="subtitle">Session Q&A - Submit Your Questions</p>
        </header>

        <div class="main-content">
            <!-- Question Form Section -->
            <section class="form-section">
                <h2>Submit a Question</h2>
                <form id="questionForm" class="question-form">
                    <div class="form-group">
                        <label for="name">Name *</label>
                        <input type="text" id="name" name="name" required>
                    </div>

                    <div class="form-group">
                        <label for="title">Title/Position</label>
                        <input type="text" id="title" name="title">
                    </div>

                    <div class="form-group">
                        <label for="organization">Organization</label>
                        <input type="text" id="organization" name="organization">
                    </div>

                    <div class="form-group">
                        <label for="contacts">Contact (Email/Phone) *</label>
                        <input type="text" id="contacts" name="contacts" required>
                    </div>

                    <div class="form-group">
                        <label for="category">Category *</label>
                        <select id="category" name="category" required>
                            <option value="">Select a category</option>
                            <option value="technical">Technical</option>
                            <option value="features">Features</option>
                            <option value="others">Others</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="question">Question *</label>
                        <textarea id="question" name="question" rows="4" required placeholder="Enter your question here..."></textarea>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Submit Question</button>
                        <button type="button" class="btn btn-secondary" id="addAnotherBtn">Add Another Question</button>
                    </div>
                </form>
            </section>

            <!-- Submitted Questions Section -->
            <section class="questions-section">
                <div class="section-header">
                    <h2>Submitted Questions</h2>
                    <div class="header-actions">
                        <button id="exportBtn" class="btn btn-outline">Export JSON</button>
                        <button id="clearBtn" class="btn btn-outline btn-danger">Clear All</button>
                    </div>
                </div>

                <div id="questionsList" class="questions-list">
                    <p class="empty-state">No questions submitted yet. Be the first to ask!</p>
                </div>
            </section>
        </div>

        <footer>
            <p>UNGA Speech Analysis Q&A Session</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
